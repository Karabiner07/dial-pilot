name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Build APK
        run: ./gradlew assembleDebug 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Surfaces compiler errors and failing tests as annotations, readable without the raw log.
      - name: Report failure
        if: failure()
        run: |
          summary=$(grep -E "^e: |FAILED|What went wrong|Exception|expected:|\.kt:[0-9]+" build.log | head -40)
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            if [ -f "$f" ]; then summary="$summary"$'\n'"$(grep -A3 '<failure' "$f" | head -10)"; fi
          done
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\n'/'%0A'}"
          echo "::error title=Build failure::$summary"

      - uses: actions/upload-artifact@v4
        with:
          name: dial-pilot-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A release gives a direct .apk download link that works well from a phone browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dial Pilot build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
