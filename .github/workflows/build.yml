name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Test, lint and build release APK
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # Surfaces compiler, lint and test failures as an annotation, readable without the raw log.
      - name: Report failure
        if: failure()
        run: |
          summary=$(grep -E "^e: |Error:|FAILED|What went wrong|Exception|expected:|\.kt:[0-9]+" build.log | head -40)
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            if [ -f "$f" ]; then summary="$summary"$'\n'"$(grep -A3 '<failure' "$f" | head -10)"; fi
          done
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\n'/'%0A'}"
          echo "::error title=Build failure::$summary"

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk dial-pilot.apk

      - uses: actions/upload-artifact@v6
        with:
          name: dial-pilot-apk
          path: dial-pilot.apk

      # A release gives a direct download link that works from a phone browser. The asset keeps
      # the same name, so .../releases/latest/download/dial-pilot.apk always points to the newest.
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Dial Pilot build ${{ github.run_number }}
          files: dial-pilot.apk
          make_latest: true
